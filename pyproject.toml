[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-worker"
version = "1.1.0"
description = "Authorized load and behaviour testing platform for anonymous forum websites"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["load-testing", "performance", "playwright", "capacity-planning", "qa"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing :: Traffic Generation",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "playwright>=1.45,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
distributed = ["redis>=5.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
social-worker = "cli.main:main"

[tool.setuptools]
packages = ["app", "cli", "mock_site"]

[tool.pytest.ini_options]
# The canonical pytest configuration lives in pytest.ini so it is picked up
# regardless of how the suite is invoked; this block mirrors the essentials.
testpaths = ["tests"]
asyncio_mode = "auto"
