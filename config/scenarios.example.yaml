# Example scenarios for Social Worker.
# Copy to config/scenarios.yaml and edit for your authorized target.
scenarios:
- name: scenario_01
  description: Visit only - open the site and leave.
  steps:
  - action: OPEN_SITE
    repeat: 1
    probability: 1.0
    min_seconds: 0.0
    max_seconds: 0.0
    forum: ''
    category: ''
    note: ''
  - action: WAIT_FOR_LOAD
    repeat: 1
    probability: 1.0
    min_seconds: 0.0
    max_seconds: 0.0
    forum: ''
    category: ''
    note: ''
  - action: THINK
    repeat: 1
    probability: 1.0
    min_seconds: 2.0
    max_seconds: 6.0
    forum: ''
    category: ''
    note: ''
  - action: END_SESSION
    repeat: 1
    probability: 1.0
    min_seconds: 0.0
    max_seconds: 0.0
    forum: ''
    category: ''
    note: ''
  allow_posting: false
  allow_replying: false
  loop: false
  max_duration_seconds: 0.0
